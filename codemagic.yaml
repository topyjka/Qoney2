workflows:
  income-calculator-ios:
    name: IncomeCalculator iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Locate Xcode project and scheme
        script: |
          echo "Repository root: $CM_BUILD_DIR"
          find "$CM_BUILD_DIR" -maxdepth 5 -name 'Unity-iPhone.xcodeproj' -print
          test -d "$CM_BUILD_DIR/Unity-iPhone.xcodeproj" || {
            echo "ERROR: Unity-iPhone.xcodeproj was not found in the repository root."
            echo "Upload the CONTENTS of the exported iOS build folder, so Unity-iPhone.xcodeproj and Frameworks/Data/Classes are at the repository root."
            exit 1
          }
          xcodebuild -list -project "$CM_BUILD_DIR/Unity-iPhone.xcodeproj"
      - name: Build unsigned iOS app
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ios"
          xcodebuild             -project "$CM_BUILD_DIR/Unity-iPhone.xcodeproj"             -scheme Unity-iPhone             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$CM_BUILD_DIR/build/ios/DerivedData"             CODE_SIGNING_ALLOWED=NO             build
    artifacts:
      - build/ios/DerivedData/Build/Products/Release-iphoneos/*.app
      - build/ios/DerivedData/Build/Products/Release-iphoneos/*.dSYM
      - /tmp/xcodebuild_logs/*.log
