workflows:
  income-calculator-ios:
    name: IncomeCalculator iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Find Xcode project and fix script permissions
        script: |
          PROJECT_PATH="$(find "$CM_BUILD_DIR" -maxdepth 8 -type d -name 'Unity-iPhone.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: Unity-iPhone.xcodeproj not found."
            exit 1
          fi
          echo "$PROJECT_PATH" > "$CM_BUILD_DIR/project_path.txt"
          chmod +x "$CM_BUILD_DIR/process_symbols.sh" 2>/dev/null || true
          find "$CM_BUILD_DIR" -type f \( -name '*.sh' -o -name 'process_symbols' -o -name 'process_symbols_il2cpp.sh' \) -exec chmod +x {} \;
          xcodebuild -list -project "$PROJECT_PATH"
      - name: Build and package unsigned IPA
        script: |
          PROJECT_PATH="$(cat "$CM_BUILD_DIR/project_path.txt")"
          mkdir -p "$CM_BUILD_DIR/build/ios"
          xcodebuild             -project "$PROJECT_PATH"             -scheme Unity-iPhone             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$CM_BUILD_DIR/build/ios/DerivedData"             CODE_SIGNING_ALLOWED=NO             build
          APP_PATH="$CM_BUILD_DIR/build/ios/DerivedData/Build/Products/Release-iphoneos/Unity-iPhone.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Unity-iPhone.app was not produced."
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/build/ios/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ios/Payload/Unity-iPhone.app"
          cd "$CM_BUILD_DIR/build/ios"
          /usr/bin/zip -qry IncomeCalculator.ipa Payload
    artifacts:
      - build/ios/*.ipa
      - build/ios/DerivedData/Build/Products/Release-iphoneos/*.app
      - build/ios/DerivedData/Build/Products/Release-iphoneos/*.dSYM
